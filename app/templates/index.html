<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipecat meeting agent</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17252b; background: #f5f7f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 480px; padding: 36px; background: white; border: 1px solid #e3e9e5; border-radius: 18px; box-shadow: 0 12px 36px #173d2910; }
    .eyebrow { margin: 0 0 14px; color: #557266; font-size: 12px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 30px; letter-spacing: -.03em; font-weight: 650; }
    .intro { margin: 0 0 28px; color: #5c6963; font-size: 15px; line-height: 1.6; }
    label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 600; }
    input, button { width: 100%; min-height: 48px; border-radius: 9px; font: inherit; }
    input { padding: 12px; border: 1px solid #cbd6cf; background: #fcfdfc; font-size: 14px; }
    input:focus { outline: 3px solid #cce5d8; outline-offset: 2px; border-color: #28664c; }
    button { margin-top: 14px; border: 0; background: #174d38; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #103d2b; }
    button:focus-visible { outline: 3px solid #a7cbb8; outline-offset: 3px; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin: 16px 0 0; font-size: 14px; line-height: 1.5; color: #365f47; }
    #status:empty { display: none; }
    #status[data-error="true"] { color: #a43030; }
    #transcript { margin-top: 24px; border-top: 1px solid #e3e9e5; }
    #transcript h2 { font-size: 18px; }
    #transcript-status { color: #5c6963; font-size: 14px; }
    #utterances { margin: 0; padding: 0; max-height: 16rem; overflow-y: auto; list-style: none; }
    #utterances li { padding: 8px 0; border-top: 1px solid #e3e9e5; overflow-wrap: anywhere; }
    @media (max-width: 480px) { main { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Recall + Pipecat</p>
    <h1>Bring an agent to your meeting.</h1>
    <p class="intro">
      Paste a meeting link from Google Meet, Zoom, Microsoft Teams, or Webex.
      For your first test, <a href="https://meet.new/" target="_blank" rel="noopener noreferrer">start a Google Meet call</a>.
    </p>
    <form id="meeting-form">
      <label for="meeting-url">Meeting URL</label>
      <input id="meeting-url" name="meeting_url" type="url" placeholder="https://meet.google.com/abc-defg-hij" required autocomplete="off" spellcheck="false">
      <button type="submit">Send agent</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="transcript" aria-labelledby="transcript-title" hidden>
      <h2 id="transcript-title">Live transcript</h2>
      <p id="transcript-status" role="status"></p>
      <ol id="utterances"></ol>
    </section>
  </main>
  <script>
    const form = document.querySelector("#meeting-form");
    const input = document.querySelector("#meeting-url");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const transcript = document.querySelector("#transcript");
    const transcriptStatus = document.querySelector("#transcript-status");
    const utterances = document.querySelector("#utterances");
    let pending = false;
    let activeBotId = null;

    async function watchTranscript(botId) {
      activeBotId = botId;
      const url = "/api/bots/" + encodeURIComponent(botId) + "/transcript";
      let lastUtteranceId = null;
      utterances.replaceChildren();
      transcriptStatus.textContent = "Waiting for speech…";
      transcript.hidden = false;

      while (activeBotId === botId) {
        let message;
        try {
          const response = await fetch(url);
          if (!response.ok && response.status !== 404) throw new Error("Transcript unavailable.");
          const rows = response.ok ? await response.json() : null;
          if (activeBotId !== botId) return;
          if (rows === null) {
            transcriptStatus.textContent = "Meeting session ended.";
            return;
          }
          const newestId = rows.at(-1)?.id ?? null;
          if (lastUtteranceId !== newestId) {
            const following = utterances.scrollHeight - utterances.scrollTop - utterances.clientHeight < 12;
            utterances.replaceChildren(...rows.map(({ speaker, text }) => {
              const line = document.createElement("li");
              line.textContent = speaker ? speaker + ": " + text : text;
              return line;
            }));
            if (following) utterances.scrollTop = utterances.scrollHeight;
            lastUtteranceId = newestId;
          }
          message = rows.length ? "" : "Waiting for speech…";
        } catch {
          if (activeBotId !== botId) return;
          message = "Reconnecting to the transcript…";
        }
        if (transcriptStatus.textContent !== message) transcriptStatus.textContent = message;
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
    }

    const linkedBot = new URLSearchParams(window.location.search).get("bot");
    if (linkedBot) watchTranscript(linkedBot);

    input.addEventListener("input", () => {
      if (!pending) {
        button.disabled = false;
        status.textContent = "";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (pending || button.disabled) return;
      pending = true;
      input.disabled = true;
      button.disabled = true;
      button.textContent = "Sending…";
      status.dataset.error = "false";
      status.textContent = "Requesting your meeting agent…";
      try {
        const response = await fetch("/api/bots", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ meeting_url: input.value.trim() }),
        });
        const result = await response.json();
        if (!response.ok) {
          const detail = Array.isArray(result.detail) ? result.detail[0]?.msg : result.detail;
          throw new Error(detail || "The agent could not be requested.");
        }
        status.textContent = result.message;
        history.replaceState(null, "", "?bot=" + encodeURIComponent(result.bot_id));
        watchTranscript(result.bot_id);
      } catch (error) {
        status.dataset.error = "true";
        status.textContent = error instanceof TypeError || error instanceof SyntaxError
          ? "Could not confirm the request. Check the meeting before trying again."
          : error.message;
        button.disabled = false;
      } finally {
        pending = false;
        input.disabled = false;
        button.textContent = "Send agent";
      }
    });
  </script>
</body>
</html>
